<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Message received · Goodfolk</title>
  <style>
    :root { color-scheme: light; --ink:#22251f; --muted:#6d7167; --green:#365b45; --paper:#fffefa; --wash:#f5f3ef; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--wash); color:var(--ink); font:16px/1.55 "Segoe UI",Arial,sans-serif; }
    .topbar { height:76px; padding:0 max(24px,calc((100vw - 1120px)/2)); display:flex; align-items:center; border-bottom:1px solid #e8e6df; }
    .brand { color:var(--ink); font: bold 23px Georgia,serif; text-decoration:none; letter-spacing:-.7px; }
    .brand span { color:var(--green); }
    main { width:min(100% - 40px, 650px); margin:90px auto; }
    .card { padding:55px 45px 58px; background:var(--paper); border:1px solid #e9e7df; border-radius:8px; box-shadow:0 14px 40px #292a2010; text-align:center; }
    .icon { display:grid; width:54px; height:54px; margin:0 auto 21px; place-items:center; border-radius:50%; background:#e8efe7; color:var(--green); font-size:25px; }
    .eyebrow { color:var(--green); font-size:12px; font-weight:700; letter-spacing:1.8px; text-transform:uppercase; }
    h1 { margin:12px 0; font:normal clamp(38px,7vw,48px)/1.1 Georgia,serif; letter-spacing:-1.5px; }
    p { max-width:430px; margin:0 auto 26px; color:var(--muted); }
    .link { display:inline-block; padding:12px 20px; border-radius:4px; background:var(--green); color:white; font-weight:600; text-decoration:none; }
    footer { padding:24px; border-top:1px solid #e8e6df; color:var(--muted); text-align:center; font-size:12px; }
  </style>
</head>
<body>
  <header class="topbar"><a class="brand" href="/contact">goodfolk<span>.</span></a></header>
  <main>
    <section class="card">
      <div class="icon" aria-hidden="true">✓</div>
      <div class="eyebrow">Message sent</div>
      <h1>Thanks for reaching out.</h1>
      <p>Your message has been received. We appreciate you taking the time to write and look forward to connecting.</p>
      <a class="link" href="/contact">Back to contact</a>
    </section>
  </main>
  <footer>Good conversations start here.</footer>
</body>
</html>
